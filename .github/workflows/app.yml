name: app

# A01 — the Swift companion app (docs/specs/A01-companion-app.md).
#
# Separate from ci.yml because it needs a macOS runner (Xcode, the iOS
# SDK, CoreBluetooth) and macOS minutes are billed at 10x Linux. It is
# path-filtered accordingly: the app job runs only when the app itself or
# the C core it compiles in place changes.
#
# firmware/core/** is in the filter deliberately. FireflyCore is not a
# copy of the core, it is the core, symlinked in — so a change under
# firmware/core/src can break the app's build without touching a single
# file under app/. That is the whole reason CoreSourceLinkTests exists,
# and this filter is what makes it run at the right moment.
#
# Hardware tests that need a REAL Heltec V3 are NOT run here - a hosted
# runner has no USB device and no Bluetooth range, and they are gated
# FIREFLY_HARDWARE=1, run manually from a Mac (see app/README.md). The
# `xcode` job's last step DOES run `xcodebuild test
# -only-testing:FireflyHardwareTests` with that env var unset, but only
# to prove the app-hosted BLE hardware suite builds and skips cleanly
# (docs/specs/A01-companion-app.md, B1) - never to exercise a board.

on:
  pull_request:
    paths:
      - "app/**"
      - "firmware/core/**"
      - "firmware/platform/**"
      - "firmware/app/theme/ff_theme.h"
      - "firmware/meshclient/tools/gen_nanopb.sh"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "firmware/core/**"
      - "firmware/platform/**"
      - "firmware/app/theme/ff_theme.h"
      - "firmware/meshclient/tools/gen_nanopb.sh"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: FireflyKit (swift build + test)
    # macos-26 (Tahoe): GitHub Actions' macOS-26 runner image reached
    # general availability 2026-02-26 (github.blog/changelog, 2025-09-11
    # preview -> 2026-02-26 GA) and carries Xcode 26.x by default, matching
    # the Xcode 26.6 / Swift 6.3.3 every build claim in this repo is
    # verified against. Bump this again if a later Xcode major is needed.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinned to an Xcode_<version>.app path: the
      # runner image rotates those, and a stale pin fails as "no such
      # directory" rather than as anything informative. The image's
      # default Xcode is recorded in the log instead, so a build that
      # breaks on a toolchain bump can be read back to the bump.
      - name: Versions
        run: swift --version && xcodebuild -version

      # The symlink farm is committed, but a checkout on a filesystem
      # that mangles symlinks (or a stale farm) must fail LOUDLY here
      # rather than as a confusing compile error 200 lines down.
      - name: Core source links are intact
        run: |
          set -euo pipefail
          missing=0
          for f in firmware/core/src/*.c; do
            b="$(basename "$f")"
            if [ ! -L "app/FireflyKit/Sources/FireflyCore/src/$b" ]; then
              echo "::error file=firmware/core/src/$b::not linked into FireflyCore - run app/tools/link_core_sources.sh"
              missing=1
            fi
          done
          # Headers too (S8): a copied header passes a src-only check
          # silently, and this farm also pulls in firmware/platform/include.
          for d in firmware/core/include firmware/platform/include; do
            for f in "$d"/*.h; do
              b="$(basename "$f")"
              if [ ! -L "app/FireflyKit/Sources/FireflyCore/include/$b" ]; then
                echo "::error file=$d/$b::not linked into FireflyCore - run app/tools/link_core_sources.sh"
                missing=1
              fi
            done
          done
          exit $missing

      - name: swift build
        working-directory: app/FireflyKit
        run: swift build

      - name: swift test
        working-directory: app/FireflyKit
        run: swift test

  xcode:
    name: Firefly.app (macOS + iOS Simulator)
    # macos-26 (Tahoe): GitHub Actions' macOS-26 runner image reached
    # general availability 2026-02-26 (github.blog/changelog, 2025-09-11
    # preview -> 2026-02-26 GA) and carries Xcode 26.x by default, matching
    # the Xcode 26.6 / Swift 6.3.3 every build claim in this repo is
    # verified against. Bump this again if a later Xcode major is needed.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: xcodebuild -version

      # Code signing is off in project.yml (CODE_SIGNING_ALLOWED=NO), so
      # neither leg needs a certificate or a provisioning profile.
      - name: Build for macOS
        working-directory: app
        run: |
          xcodebuild \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            build

      # `generic/platform=iOS Simulator` compiles for the simulator SDK
      # without booting a device - faster, and it does not depend on
      # which iPhone models the runner image happens to ship.
      - name: Build for iOS Simulator
        working-directory: app
        run: |
          xcodebuild \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'generic/platform=iOS Simulator' \
            build

      # The actual regression suite for the app's view models (Connect,
      # Settings, Diagnostics, channel import, peripheral discovery). Without
      # this step FireflyAppTests builds but nothing ever runs it, and a
      # change to any of those view models could break silently with this
      # job staying green (PR #262 review, BLOCKING).
      - name: FireflyAppTests
        working-directory: app
        run: |
          xcodebuild test \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            -only-testing:FireflyAppTests

      # NOT `FIREFLY_HARDWARE=1` and no board: this proves the app-hosted
      # BLE hardware suite builds, launches inside Firefly.app, and SKIPS
      # cleanly on a runner with no radio (docs/specs/A01-companion-app.md,
      # B1) - it never runs a hardware test here, only proves the skip.
      - name: FireflyHardwareTests build + skip on a machine with no board
        working-directory: app
        run: |
          xcodebuild test \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            -only-testing:FireflyHardwareTests
