name: app

# A01 — the Swift companion app (docs/specs/A01-companion-app.md).
#
# Separate from ci.yml because it needs a macOS runner (Xcode, the iOS
# SDK, CoreBluetooth) and macOS minutes are billed at 10x Linux. It is
# path-filtered accordingly: the app job runs only when the app itself or
# the C core it compiles in place changes.
#
# firmware/core/** is in the filter deliberately. FireflyCore is not a
# copy of the core, it is the core, symlinked in — so a change under
# firmware/core/src can break the app's build without touching a single
# file under app/. That is the whole reason CoreSourceLinkTests exists,
# and this filter is what makes it run at the right moment.
#
# firmware/festpack/** and firmware/third_party/jsmn.h are in the filter
# for the exact same reason: since the festpack-from-fest-almanac work,
# FireflyCore's symlink farm pulls those in too (app/tools/
# link_core_sources.sh) — a festpack-only PR that touched neither of
# those two path prefixes previously would not trigger this workflow at
# all, so CoreSourceLinkTests (which does check festpack) never ran for
# it.
#
# Hardware tests that need a REAL Heltec V3 are NOT run here - a hosted
# runner has no USB device and no Bluetooth range, and they are gated
# FIREFLY_HARDWARE=1, run manually from a Mac (see app/README.md). The
# `xcode` job's last step DOES run `xcodebuild test
# -only-testing:FireflyHardwareTests` with that env var unset, but only
# to prove the app-hosted BLE hardware suite builds and skips cleanly
# (docs/specs/A01-companion-app.md, B1) - never to exercise a board.
#
# The macOS leg of FireflyUITests does NOT run here (Review PR #275,
# BLOCKING 1): macOS XCUITest automation needs the Accessibility
# permission granted to the test runner, a hosted GitHub Actions runner
# is ephemeral with no persisted TCC grant between runs, and there is no
# verified way to pre-authorize it in CI. That leg is buildable but
# opt-in only - see app/README.md, "Running the macOS UI smoke test
# locally", and FireflyUITests.xctestplan / app/project.yml's scheme
# `test:` comment for how it is kept out of the default test plan
# without disturbing the iOS Simulator leg this workflow DOES run.
#
# Every step below carries its own timeout-minutes on top of each job's
# overall timeout, so a single hung step fails fast with a clear signal
# rather than silently eating the whole job budget before the job-level
# timeout finally kills it.

on:
  pull_request:
    paths:
      - "app/**"
      - "firmware/core/**"
      - "firmware/platform/**"
      - "firmware/festpack/**"
      - "firmware/third_party/jsmn.h"
      - "firmware/app/theme/ff_theme.h"
      - "firmware/meshclient/tools/gen_nanopb.sh"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "firmware/core/**"
      - "firmware/platform/**"
      - "firmware/festpack/**"
      - "firmware/third_party/jsmn.h"
      - "firmware/app/theme/ff_theme.h"
      - "firmware/meshclient/tools/gen_nanopb.sh"
      - ".github/workflows/app.yml"

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: FireflyKit (swift build + test)
    # macos-26 (Tahoe): GitHub Actions' macOS-26 runner image reached
    # general availability 2026-02-26 (github.blog/changelog, 2025-09-11
    # preview -> 2026-02-26 GA) and carries Xcode 26.x by default, matching
    # the Xcode 26.6 / Swift 6.3.3 every build claim in this repo is
    # verified against. Bump this again if a later Xcode major is needed.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinned to an Xcode_<version>.app path: the
      # runner image rotates those, and a stale pin fails as "no such
      # directory" rather than as anything informative. The image's
      # default Xcode is recorded in the log instead, so a build that
      # breaks on a toolchain bump can be read back to the bump.
      - name: Versions
        timeout-minutes: 5
        run: swift --version && xcodebuild -version

      # The symlink farm is committed, but a checkout on a filesystem
      # that mangles symlinks (or a stale farm) must fail LOUDLY here
      # rather than as a confusing compile error 200 lines down.
      - name: Core source links are intact
        timeout-minutes: 5
        run: |
          set -euo pipefail
          missing=0
          # firmware/festpack/src alongside firmware/core/src: since the
          # festpack-from-fest-almanac work, FireflyCore's symlink farm
          # pulls both in (app/tools/link_core_sources.sh's own comment) —
          # this loop mirrors that script's directory list exactly.
          for d in firmware/core/src firmware/festpack/src; do
            for f in "$d"/*.c; do
              b="$(basename "$f")"
              if [ ! -L "app/FireflyKit/Sources/FireflyCore/src/$b" ]; then
                echo "::error file=$d/$b::not linked into FireflyCore - run app/tools/link_core_sources.sh"
                missing=1
              fi
            done
          done
          # Headers too (S8): a copied header passes a src-only check
          # silently, and this farm also pulls in firmware/platform/include
          # and firmware/festpack/include.
          for d in firmware/core/include firmware/platform/include firmware/festpack/include; do
            for f in "$d"/*.h; do
              b="$(basename "$f")"
              if [ ! -L "app/FireflyKit/Sources/FireflyCore/include/$b" ]; then
                echo "::error file=$d/$b::not linked into FireflyCore - run app/tools/link_core_sources.sh"
                missing=1
              fi
            done
          done
          # jsmn.h (firmware/third_party) — the one vendored header
          # fp_pack.h #include "jsmn.h"s; link_core_sources.sh's own
          # comment has the full story.
          if [ ! -L "app/FireflyKit/Sources/FireflyCore/include/jsmn.h" ]; then
            echo "::error file=firmware/third_party/jsmn.h::not linked into FireflyCore - run app/tools/link_core_sources.sh"
            missing=1
          fi
          exit $missing

      - name: swift build
        working-directory: app/FireflyKit
        timeout-minutes: 10
        run: swift build

      - name: swift test
        working-directory: app/FireflyKit
        timeout-minutes: 10
        run: swift test

  xcode:
    name: Firefly.app (macOS + iOS Simulator)
    # macos-26 (Tahoe): GitHub Actions' macOS-26 runner image reached
    # general availability 2026-02-26 (github.blog/changelog, 2025-09-11
    # preview -> 2026-02-26 GA) and carries Xcode 26.x by default, matching
    # the Xcode 26.6 / Swift 6.3.3 every build claim in this repo is
    # verified against. Bump this again if a later Xcode major is needed.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        timeout-minutes: 5
        run: xcodebuild -version

      # Code signing is off in project.yml (CODE_SIGNING_ALLOWED=NO), so
      # neither leg needs a certificate or a provisioning profile.
      - name: Build for macOS
        working-directory: app
        timeout-minutes: 10
        run: |
          xcodebuild \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            build

      # `generic/platform=iOS Simulator` compiles for the simulator SDK
      # without booting a device - faster, and it does not depend on
      # which iPhone models the runner image happens to ship.
      - name: Build for iOS Simulator
        working-directory: app
        timeout-minutes: 10
        run: |
          xcodebuild \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'generic/platform=iOS Simulator' \
            build

      # The actual regression suite for the app's view models (Connect,
      # Settings, Diagnostics, channel import, peripheral discovery). Without
      # this step FireflyAppTests builds but nothing ever runs it, and a
      # change to any of those view models could break silently with this
      # job staying green (PR #262 review, BLOCKING).
      - name: FireflyAppTests
        working-directory: app
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            -only-testing:FireflyAppTests

      # NOT `FIREFLY_HARDWARE=1` and no board: this proves the app-hosted
      # BLE hardware suite builds, launches inside Firefly.app, and SKIPS
      # cleanly on a runner with no radio (docs/specs/A01-companion-app.md,
      # B1) - it never runs a hardware test here, only proves the skip.
      - name: FireflyHardwareTests build + skip on a machine with no board
        working-directory: app
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -destination 'platform=macOS' \
            -only-testing:FireflyHardwareTests

      # M3's XCUITest smoke suite (docs/specs/A01-companion-app.md, "UI").
      # `-FireflyDemo` (`AppDependencies.current()`'s own doc comment)
      # only ever does anything in the iOS Simulator, which is exactly
      # what this leg drives: launch, tap through Connect -> Radar ->
      # Inbox -> Thread -> Settings, asserting each screen's own
      # accessibility identifier. `name=iPhone 17 Pro` matches the
      # device this repo's own verification runs against — GitHub's
      # macos-26 runner image ships it as of this workflow's own
      # "Versions" pin above (Xcode 26.x).
      #
      # `-testPlan FireflyUITests`: FireflyUITests is deliberately NOT a
      # member of the scheme's default test plan (Review PR #275,
      # BLOCKING 1 - see this file's own header comment and
      # app/project.yml's scheme `test:` comment), so it has to be
      # selected through its own, non-default plan explicitly. This is
      # also why there is no macOS counterpart step here: that leg lives
      # only in the same named plan, run by hand locally after granting
      # Accessibility to Xcode (app/README.md).
      #
      # timeout-minutes: 20, not 10 - this is the first step in the job
      # to target the iOS Simulator SDK/destination rather than macOS, so
      # it cannot reuse the prior steps' (macOS-slice) DerivedData object
      # files and pays a near-from-scratch build-for-testing cost on a
      # cold hosted runner (observed ~9.5 minutes for the build alone
      # landing PR #275's review-response commit, which left the actual
      # test run only seconds of its 10-minute budget and got killed by
      # the step timeout mid-launch - a real CI failure, not a flake).
      # 20 minutes leaves a comfortable margin over that observed cost
      # while staying well inside this job's own 40-minute timeout.
      - name: FireflyUITests (iOS Simulator)
        working-directory: app
        timeout-minutes: 20
        run: |
          xcodebuild test \
            -project Firefly.xcodeproj \
            -scheme Firefly \
            -testPlan FireflyUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:FireflyUITests
