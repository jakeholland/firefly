# project.yml — the source of truth for app/Firefly.xcodeproj.
#
# The .xcodeproj IS committed, so CI and a fresh clone need nothing but
# Xcode. This file exists so the project can be REGENERATED rather than
# hand-edited into an unreviewable 3000-line pbxproj diff:
#
#     brew install xcodegen && (cd app && xcodegen generate)
#
# Regenerate and commit both whenever you change targets, settings or
# Info.plist wiring. See app/README.md.
name: Firefly
options:
  bundleIdPrefix: com.jakeholland
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  FireflyKit:
    path: FireflyKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Firefly:
    type: application
    # One target, both platforms - "one multiplatform app", not an iOS
    # app with a Mac sibling that drifts.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Firefly/Sources
    dependencies:
      - package: FireflyKit
        product: FireflyCore
      - package: FireflyKit
        product: MeshtasticProto
      - package: FireflyKit
        product: FireflyMesh
      - package: FireflyKit
        product: FireflyModel
    settings:
      base:
        PRODUCT_NAME: Firefly
        PRODUCT_BUNDLE_IDENTIFIER: com.jakeholland.firefly
        INFOPLIST_FILE: Firefly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Firefly/Resources/Firefly.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

schemes:
  Firefly:
    build:
      targets:
        Firefly: all
    run:
      config: Debug
    test:
      config: Debug
      # FireflyKit's own tests run under `swift test`, which is faster
      # and needs no simulator. The Xcode scheme builds the app.
      targets: []
    archive:
      config: Release
