# project.yml — the source of truth for app/Firefly.xcodeproj.
#
# The .xcodeproj IS committed, so CI and a fresh clone need nothing but
# Xcode. This file exists so the project can be REGENERATED rather than
# hand-edited into an unreviewable 3000-line pbxproj diff:
#
#     brew install xcodegen && (cd app && xcodegen generate)
#
# Regenerate and commit both whenever you change targets, settings or
# Info.plist wiring. See app/README.md.
name: Firefly
options:
  bundleIdPrefix: com.jakeholland
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  FireflyKit:
    path: FireflyKit

settings:
  base:
    # M3 (docs/specs/A01-companion-app.md): "the package builds clean
    # under SWIFT_STRICT_CONCURRENCY: complete". These two are base
    # settings, not per-target, so Firefly, FireflyHardwareTests and
    # FireflyAppTests all build under Swift 6 / complete checking — the
    # same language mode FireflyKit's own Package.swift now sets via
    # `swiftLanguageModes: [.v6]`.
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Firefly:
    type: application
    # One target, both platforms - "one multiplatform app", not an iOS
    # app with a Mac sibling that drifts.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Firefly/Sources
    dependencies:
      - package: FireflyKit
        product: FireflyCore
      - package: FireflyKit
        product: MeshtasticProto
      - package: FireflyKit
        product: FireflyMesh
      - package: FireflyKit
        product: FireflyModel
    # Config/Firefly.xcconfig is committed and carries the signing
    # DEFAULTS (CODE_SIGNING_ALLOWED/REQUIRED = NO), then `#include?`s
    # (optional — no error if absent) a git-ignored Config/Local.xcconfig
    # that can override them for a personal DEVELOPMENT_TEAM + identity.
    #
    # Those two settings are deliberately NOT in `settings:` below: a
    # target-level build setting BEATS an xcconfig, so keeping them there
    # made Local.xcconfig unable to turn signing on at all — the reason
    # signed runs previously needed CODE_SIGNING_ALLOWED=YES passed on
    # the xcodebuild command line. See Config/Firefly.xcconfig's own
    # header and app/README.md, "Signed local runs".
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        PRODUCT_NAME: Firefly
        PRODUCT_BUNDLE_IDENTIFIER: com.jakeholland.firefly
        INFOPLIST_FILE: Firefly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Firefly/Resources/Firefly.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Debug carries ONE extra entitlement: the sandbox mach-lookup
          # exception `FireflyHardwareTests` needs to reach
          # `com.apple.testmanagerd` from inside this (sandboxed, and —
          # once signed — actually sandbox-ENFORCED) host app. See
          # Firefly/Resources/Firefly.Debug.entitlements' own comment.
          # Release keeps the plain Firefly.entitlements: a release build
          # hosts no tests and has no business talking to a test daemon.
          CODE_SIGN_ENTITLEMENTS: Firefly/Resources/Firefly.Debug.entitlements

  # App-hosted BLE hardware tests (docs/specs/A01-companion-app.md, B1).
  # macOS aborts (__TCC_CRASHING_DUE_TO_PRIVACY_VIOLATION__) any
  # CoreBluetooth process that is not inside a signed .app bundle
  # carrying NSBluetoothAlwaysUsageDescription and launched via
  # LaunchServices — a bare `swift test` xctest binary is none of those
  # three things. So this is a unit-test bundle HOSTED inside Firefly.app
  # (macOS only: there is no iOS destination to run it against from a
  # CI-shaped command line), run with:
  #
  #   xcodebuild test -scheme Firefly -destination 'platform=macOS' \
  #     -only-testing:FireflyHardwareTests
  #
  # Serial and TCP hardware tests are unaffected by TCC and stay under
  # `swift test` (FireflyKit/Tests/HardwareTests, slice F).
  FireflyHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FireflyHardwareTests
    dependencies:
      - target: Firefly
    # Same xcconfig as the host app, so a signed local run signs the
    # test bundle too — see the Firefly target's own comment.
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # Required for a SIGNED run: codesign needs an Info.plist in the
        # test bundle, and a unit-test target has no INFOPLIST_FILE of
        # its own. Without this, `xcodebuild test` with signing enabled
        # fails with "Cannot code sign because the target does not have
        # an Info.plist file" (slice A hit exactly this). Harmless
        # unsigned: the generated plist is written either way.
        GENERATE_INFOPLIST_FILE: YES
        # Set explicitly rather than left to xcodegen's own inference:
        # against a multiplatform (`supportedDestinations: [iOS, macOS]`)
        # host target, xcodegen's auto-derived TEST_HOST omits macOS's
        # Contents/MacOS path component and evaluates to a binary that
        # does not exist ("Could not find test host"). This is the path
        # a macOS .app bundle actually uses.
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Firefly.app/Contents/MacOS/Firefly"

  # Slice C's addition — a plain logic-test bundle (no TEST_HOST, no
  # CoreBluetooth involved) for the view models that live in the APP
  # target rather than FireflyKit (NearbyNodesViewModel,
  # ChannelImportViewModel, PeripheralDiscovery, SettingsViewModel,
  # DiagnosticsViewModel — see docs/specs/A01-companion-app.md's Slice C
  # "Must add": "Add view-model unit tests"). `swift test` cannot reach
  # these: they are app-target-only Swift, not part of the FireflyKit
  # SwiftPM package. `sources` lists exactly those five files, not the
  # whole Connect/Settings directories, so this target never has to
  # compile the SwiftUI screens themselves (untestable without
  # ViewInspector, per the spec) or their Theme+SwiftUI dependency —
  # `xcodebuild build` on the Firefly target is what proves those.
  FireflyAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Firefly/Sources/Connect/NearbyNodesViewModel.swift
      - path: Firefly/Sources/Connect/ChannelImportViewModel.swift
      - path: Firefly/Sources/Connect/PeripheralDiscovery.swift
      - path: Firefly/Sources/Settings/SettingsViewModel.swift
      - path: Firefly/Sources/Settings/DiagnosticsViewModel.swift
      # M2's addition: the Crew section's own view model (rename/remove,
      # backed by CrewPairingController) — appended, not inserted, so
      # this stays a pure addition to the list the other four already
      # occupy.
      - path: Firefly/Sources/Settings/CrewSettingsViewModel.swift
      - path: Firefly/Tests
    dependencies:
      - package: FireflyKit
        product: FireflyCore
      - package: FireflyKit
        product: MeshtasticProto
      - package: FireflyKit
        product: FireflyMesh
      - package: FireflyKit
        product: FireflyModel
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # See FireflyHardwareTests' own comment — same codesign
        # requirement, same reason.
        GENERATE_INFOPLIST_FILE: YES

  # M3's XCUITest smoke suite (docs/specs/A01-companion-app.md, "UI").
  # `supportedDestinations` matches the `Firefly` host so ONE target
  # builds and runs against either platform xcodegen wires as the UI
  # test host automatically from `dependencies: - target: Firefly`
  # below — no TEST_HOST/BUNDLE_LOADER of its own (that is a
  # unit-test-bundle mechanism, `FireflyHardwareTests`'/`FireflyAppTests`'
  # own comments; a `bundle.ui-testing` target launches its host as a
  # separate process instead). See `FireflyUITests.swift`'s own header
  # comment for why the iOS and macOS tests differ in what they do.
  FireflyUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FireflyUITests
    dependencies:
      - target: Firefly
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # Same codesign requirement as every other test bundle here —
        # see `FireflyHardwareTests`' own comment.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Firefly:
    build:
      targets:
        Firefly: all
        FireflyHardwareTests: [test]
        FireflyAppTests: [test]
        FireflyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # FireflyKit's own (non-hardware) tests run under `swift test`,
      # which is faster and needs no simulator or app host. The
      # app-hosted BLE hardware suite and slice C's app-target
      # view-model suite both run through this scheme.
      targets:
        - name: FireflyHardwareTests
          parallelizable: false
        - name: FireflyAppTests
        - name: FireflyUITests
      # macOS launches an app-hosted test's host process via
      # LaunchServices, which does NOT inherit the invoking shell's
      # environment the way a plain child process would — so
      # `FIREFLY_HARDWARE=1 xcodebuild test ...` (the command B1 and
      # app/README.md both document) silently never reaches
      # `ProcessInfo.processInfo.environment` inside the test without
      # this: `$(FIREFLY_HARDWARE)` is expanded from xcodebuild's OWN
      # process environment at scheme-launch time and threaded through
      # explicitly. Left unset, it expands empty and the gate reads as
      # "not set", i.e. skip — the safe default.
      environmentVariables:
        FIREFLY_HARDWARE: $(FIREFLY_HARDWARE)
    archive:
      config: Release
