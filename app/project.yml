# project.yml — the source of truth for app/Firefly.xcodeproj.
#
# The .xcodeproj IS committed, so CI and a fresh clone need nothing but
# Xcode. This file exists so the project can be REGENERATED rather than
# hand-edited into an unreviewable 3000-line pbxproj diff:
#
#     brew install xcodegen
#     cd app && xcodegen generate
#
# Regenerate and commit both whenever you change targets, settings or
# Info.plist wiring. See app/README.md. No environment variable is
# needed — `xcodegen generate` is plain and idempotent (run it twice,
# `git diff` is empty). See CURRENT_PROJECT_VERSION's own comment below
# for why: it used to be templated from an env var here and is not
# anymore.
name: Firefly
options:
  bundleIdPrefix: com.jakeholland
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  FireflyKit:
    path: FireflyKit

settings:
  base:
    # M3 (docs/specs/A01-companion-app.md): "the package builds clean
    # under SWIFT_STRICT_CONCURRENCY: complete". These two are base
    # settings, not per-target, so Firefly, FireflyHardwareTests and
    # FireflyAppTests all build under Swift 6 / complete checking — the
    # same language mode FireflyKit's own Package.swift now sets via
    # `swiftLanguageModes: [.v6]`.
    SWIFT_VERSION: "6.0"
    # A01/TestFlight: MARKETING_VERSION is the human-facing version
    # (bump by hand for real releases). CURRENT_PROJECT_VERSION — the
    # build number TestFlight requires to be unique on every upload —
    # is deliberately NOT set here. It used to be templated from an
    # environment variable at `xcodegen generate` time
    # (`${FIREFLY_BUILD_NUMBER}`), which meant any regeneration that
    # forgot to set it baked the literal, unresolved placeholder string
    # into the committed pbxproj as CFBundleVersion — and any build
    # that didn't override it on the command line (Xcode GUI, CI, an
    # agent running a plain `xcodebuild`) shipped that placeholder.
    # Leaving CURRENT_PROJECT_VERSION out of both `settings:` here AND
    # the target's own `settings:` below means it falls through to
    # Config/Firefly.xcconfig's plain, always-valid `1` — a target-level
    # build setting beats an xcconfig (see that file's own comment), so
    # it must stay absent from both `settings:` blocks for the xcconfig
    # default to actually apply. app/tools/testflight.sh overrides that
    # default on the `xcodebuild archive` command line with the real
    # `git rev-list --count HEAD` value — see that script's own header
    # comment and app/README.md, "Shipping a TestFlight build".
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Firefly:
    type: application
    # One target, both platforms - "one multiplatform app", not an iOS
    # app with a Mac sibling that drifts.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Firefly/Sources
      # Assets.xcassets (currently just AppIcon.appiconset — the flare
      # mark, app/tools/make_app_icon.py). xcodegen treats a `.xcassets`
      # bundle under `sources` as a resource automatically; it is NOT
      # under Firefly/Sources itself only because Resources/ also holds
      # Info.plist/entitlements, which are wired via their own settings
      # keys below rather than compiled as sources.
      - path: Firefly/Resources/Assets.xcassets
      # "app: Lineup by-stage grid, day pills, My picks" — `AlmanacFestpackProvider`'s
      # bundled fallback (`lost-lands-2026.festpack.json`, "bundled
      # copy") and `DemoFestpackProvider`'s scripted world
      # (`firefly-fields.festpack.json`) both read these by name via
      # `Bundle.main.url(forResource:withExtension:)`
      # (`MainBundleFestpackLoader`) — but neither file was actually
      # wired into a Copy Bundle Resources phase before this feature,
      # so a real device/simulator launch with no cached pack (or any
      # `-FireflyDemo` launch at all) silently got "no festival pack
      # loaded yet" forever. Referenced straight from `firmware/assets/`
      # (like `firmware/core` is compiled in place via
      # `tools/link_core_sources.sh`) rather than copied into `app/`, so
      # there is exactly one copy of each fixture in the tree. Plain
      # `.json` files under `sources:` become resources automatically,
      # same as `Assets.xcassets` just above.
      # `group:` is load-bearing, not cosmetic: without it XcodeGen
      # materialises the `..` hop as a real PBXGroup whose display NAME
      # is whatever the repo's checkout directory happens to be called
      # (a worktree named `app-lineup-grid` put `name = "app-lineup-grid"`
      # straight into the committed pbxproj), so regenerating the
      # project from a differently-named checkout produced a spurious
      # diff. Pinning the group makes `xcodegen generate` byte-stable
      # wherever the repo is cloned — which `app/tools/testflight.sh`
      # relies on, since it regenerates before every archive.
      - path: ../firmware/assets/demo/firefly-fields.festpack.json
        group: Firefly/Resources/Festpacks
      - path: ../firmware/assets/field/lost-lands-2026.festpack.json
        group: Firefly/Resources/Festpacks
      # "app: automatic almanac refresh + festival picker" —
      # `AlmanacIndexProvider`'s bundled fallback index (that type's own
      # header comment): so the Settings festival picker is never empty
      # offline, even before fest-almanac itself publishes a live
      # `packs/index.json`. Same `group:`/no-copy convention as the two
      # festpacks above.
      - path: ../firmware/assets/field/fest-almanac-index.json
        group: Firefly/Resources/Festpacks
    dependencies:
      - package: FireflyKit
        product: FireflyCore
      - package: FireflyKit
        product: MeshtasticProto
      - package: FireflyKit
        product: FireflyMesh
      - package: FireflyKit
        product: FireflyModel
    # Config/Firefly.xcconfig is committed and carries the signing
    # DEFAULTS (CODE_SIGNING_ALLOWED/REQUIRED = NO), then `#include?`s
    # (optional — no error if absent) a git-ignored Config/Local.xcconfig
    # that can override them for a personal DEVELOPMENT_TEAM + identity.
    #
    # Those two settings are deliberately NOT in `settings:` below: a
    # target-level build setting BEATS an xcconfig, so keeping them there
    # made Local.xcconfig unable to turn signing on at all — the reason
    # signed runs previously needed CODE_SIGNING_ALLOWED=YES passed on
    # the xcodebuild command line. See Config/Firefly.xcconfig's own
    # header and app/README.md, "Signed local runs".
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        PRODUCT_NAME: Firefly
        PRODUCT_BUNDLE_IDENTIFIER: com.jakeholland.Firefly
        TARGETED_DEVICE_FAMILY: "1"   # iPhone-only: the app is a pocket compass; iPad runs it in compatibility mode
        INFOPLIST_FILE: Firefly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Firefly/Resources/Firefly.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        # AppIcon.appiconset — the flare mark, generated by
        # app/tools/make_app_icon.py (see that script's own header).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Debug carries ONE extra entitlement: the sandbox mach-lookup
          # exception `FireflyHardwareTests` needs to reach
          # `com.apple.testmanagerd` from inside this (sandboxed, and —
          # once signed — actually sandbox-ENFORCED) host app. See
          # Firefly/Resources/Firefly.Debug.entitlements' own comment.
          # Release keeps the plain Firefly.entitlements: a release build
          # hosts no tests and has no business talking to a test daemon.
          CODE_SIGN_ENTITLEMENTS: Firefly/Resources/Firefly.Debug.entitlements

  # App-hosted BLE hardware tests (docs/specs/A01-companion-app.md, B1).
  # macOS aborts (__TCC_CRASHING_DUE_TO_PRIVACY_VIOLATION__) any
  # CoreBluetooth process that is not inside a signed .app bundle
  # carrying NSBluetoothAlwaysUsageDescription and launched via
  # LaunchServices — a bare `swift test` xctest binary is none of those
  # three things. So this is a unit-test bundle HOSTED inside Firefly.app
  # (macOS only: there is no iOS destination to run it against from a
  # CI-shaped command line), run with:
  #
  #   xcodebuild test -scheme Firefly -destination 'platform=macOS' \
  #     -only-testing:FireflyHardwareTests
  #
  # Serial and TCP hardware tests are unaffected by TCC and stay under
  # `swift test` (FireflyKit/Tests/HardwareTests, slice F).
  FireflyHardwareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FireflyHardwareTests
    dependencies:
      - target: Firefly
    # Same xcconfig as the host app, so a signed local run signs the
    # test bundle too — see the Firefly target's own comment.
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # Required for a SIGNED run: codesign needs an Info.plist in the
        # test bundle, and a unit-test target has no INFOPLIST_FILE of
        # its own. Without this, `xcodebuild test` with signing enabled
        # fails with "Cannot code sign because the target does not have
        # an Info.plist file" (slice A hit exactly this). Harmless
        # unsigned: the generated plist is written either way.
        GENERATE_INFOPLIST_FILE: YES
        # Set explicitly rather than left to xcodegen's own inference:
        # against a multiplatform (`supportedDestinations: [iOS, macOS]`)
        # host target, xcodegen's auto-derived TEST_HOST omits macOS's
        # Contents/MacOS path component and evaluates to a binary that
        # does not exist ("Could not find test host"). This is the path
        # a macOS .app bundle actually uses.
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Firefly.app/Contents/MacOS/Firefly"

  # Slice C's addition — a plain logic-test bundle (no TEST_HOST, no
  # CoreBluetooth involved) for the view models that live in the APP
  # target rather than FireflyKit (NearbyNodesViewModel,
  # ChannelImportViewModel, PeripheralDiscovery, SettingsViewModel,
  # DiagnosticsViewModel — see docs/specs/A01-companion-app.md's Slice C
  # "Must add": "Add view-model unit tests"). `swift test` cannot reach
  # these: they are app-target-only Swift, not part of the FireflyKit
  # SwiftPM package. `sources` lists exactly those five files, not the
  # whole Connect/Settings directories, so this target never has to
  # compile the SwiftUI screens themselves (untestable without
  # ViewInspector, per the spec) or their Theme+SwiftUI dependency —
  # `xcodebuild build` on the Firefly target is what proves those.
  FireflyAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Firefly/Sources/Connect/NearbyNodesViewModel.swift
      - path: Firefly/Sources/Connect/ChannelImportViewModel.swift
      - path: Firefly/Sources/Connect/PeripheralDiscovery.swift
      - path: Firefly/Sources/Settings/SettingsViewModel.swift
      - path: Firefly/Sources/Settings/DiagnosticsViewModel.swift
      # M2's addition: the Crew section's own view model (rename/remove,
      # backed by CrewPairingController) — appended, not inserted, so
      # this stays a pure addition to the list the other four already
      # occupy.
      - path: Firefly/Sources/Settings/CrewSettingsViewModel.swift
      # Owner note (build 304, item 2): `MoreScreen`'s own push-state
      # rule (`Row`/`pushed(_:onto:)`), split into its own SwiftUI-free
      # file specifically so it can sit in this list without dragging in
      # `MoreScreen.swift` itself (which would pull in ConnectScreen/
      # SettingsScreen/DiagnosticsScreen and the SwiftUI/Theme
      # dependency this target's own comment above says to avoid).
      - path: Firefly/Sources/MoreScreenNavigation.swift
      # "app: Find tab — Radar · Map · Field segments" — the segment
      # enum and its pure start/stop rule, split into its own
      # SwiftUI/FireflyModel-free file for the SAME reason
      # `MoreScreenNavigation.swift` just above is (its own header
      # comment): so `FireflyAppTests` can exercise the rule without
      # `FindScreen.swift`'s SwiftUI/Theme dependency.
      - path: Firefly/Sources/Find/FindSegment.swift
      # Pre-existing gap (found while verifying this PR): PR #300 added
      # `FireflyDebugStartDestinationLaunch.swift` and its test
      # (`FireflyDebugStartDestinationLaunchTests.swift`, pulled in by
      # the `Firefly/Tests` line below) but never added the production
      # file here — `xcodebuild test -only-testing:FireflyAppTests`
      # failed to BUILD (not just fail a test) with "cannot find
      # 'FireflyDebugStartDestinationLaunch' in scope" before this line
      # existed. SwiftUI/FireflyModel-free, same as every other file in
      # this list, so it belongs here on the merits too.
      - path: Firefly/Sources/FireflyDebugStartDestinationLaunch.swift
      # A02's one view model (`CrewController.swift`'s own header
      # comment) — SwiftUI-free (Observation only), same reasoning as
      # every other file in this list.
      - path: Firefly/Sources/Crew/CrewController.swift
      # The presence-vocabulary adapter (PR #308 review). SwiftUI-free
      # by construction — it holds no strings of its own, only the
      # `HeardPresence` -> `PresenceTag` mapping onto PR #304's shipped
      # `plainLabel(age:)`/`CrewDisplayFallback` words — and that
      # delegation is exactly what `CrewCopyTests` pins.
      - path: Firefly/Sources/Crew/CrewCopy.swift
      # A02 slice E's two Advanced-only view models (`CrewHeardListView
      # Model`/`CrewDiagnosticsViewModel`'s own header comments) —
      # SwiftUI-free by construction, same reasoning as every other file
      # in this list, appended for the same reason `CrewController.swift`
      # is here: `Firefly/Tests` below needs them in scope to build.
      - path: Firefly/Sources/Crew/CrewHeardListViewModel.swift
      - path: Firefly/Sources/Crew/CrewDiagnosticsViewModel.swift
      # Hotfix (build 328 SIGABRT, `NotificationTapRouterTests`) —
      # `NotificationTapRouter` is `Foundation`/`FireflyModel` only
      # (conditionally `UserNotifications`), no SwiftUI/Theme, same
      # reasoning as every other file in this list.
      - path: Firefly/Sources/NotificationTapRouter.swift
      # The connect-first onboarding's bench seam (`-FireflyDebugJoinCrew`
      # /`-FireflyDebugStartCrew`) — SwiftUI-free by construction, the
      # same shape and the same reason as
      # `FireflyDebugStartDestinationLaunch.swift` just above.
      - path: Firefly/Sources/Crew/FireflyDebugCrewLaunch.swift
      # The bench-state seam (`-FireflyDebugForgetCrewMembers` /
      # `-FireflyDebugSetCrewProfile`) A02 §4.2.2's hardware repro needs
      # — SwiftUI-free by construction (Foundation + FireflyModel), same
      # shape and same reason as `FireflyDebugCrewLaunch.swift` above.
      - path: Firefly/Sources/Crew/FireflyDebugCrewStateLaunch.swift
      # `-FireflyDebugNotify`'s parser (DEBUG-only reproduction seam for
      # `NotificationTapUITests`), same shape and same reason as
      # `FireflyDebugStartDestinationLaunch.swift` above.
      - path: Firefly/Sources/FireflyDebugNotifyLaunch.swift
      # The cold-launch landing rule (`RootLaunchPlan`), split into its
      # own SwiftUI-free file for the SAME reason `MoreScreenNavigation
      # .swift` and `Find/FindSegment.swift` above are: so this target
      # can exercise "a pending deep link wins over the first-launch
      # default, cover included" without `RootView.swift`'s SwiftUI/
      # Theme dependency.
      - path: Firefly/Sources/RootLaunchPlan.swift
      # "app: Try the demo" — the mode-switch decision (which direction,
      # which `AppDependencies`, which requested screen), split into its
      # own `FireflyModel`-only file for the SAME reason `RootLaunchPlan
      # .swift` just above is: so this target can exercise it without
      # `AppRuntimeBundle.swift`'s own `AppGraph`/view-model composition
      # (which pulls in enough of the app's other view models that it is
      # exercised by `FireflyUITests` instead, not duplicated here).
      - path: Firefly/Sources/DemoModeAction.swift
      - path: Firefly/Tests
    dependencies:
      - package: FireflyKit
        product: FireflyCore
      - package: FireflyKit
        product: MeshtasticProto
      - package: FireflyKit
        product: FireflyMesh
      - package: FireflyKit
        product: FireflyModel
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # See FireflyHardwareTests' own comment — same codesign
        # requirement, same reason.
        GENERATE_INFOPLIST_FILE: YES

  # M3's XCUITest smoke suite (docs/specs/A01-companion-app.md, "UI").
  # `supportedDestinations` matches the `Firefly` host so ONE target
  # builds and runs against either platform xcodegen wires as the UI
  # test host automatically from `dependencies: - target: Firefly`
  # below — no TEST_HOST/BUNDLE_LOADER of its own (that is a
  # unit-test-bundle mechanism, `FireflyHardwareTests`'/`FireflyAppTests`'
  # own comments; a `bundle.ui-testing` target launches its host as a
  # separate process instead). See `FireflyUITests.swift`'s own header
  # comment for why the iOS and macOS tests differ in what they do.
  FireflyUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: FireflyUITests
    dependencies:
      - target: Firefly
    configFiles:
      Debug: Config/Firefly.xcconfig
      Release: Config/Firefly.xcconfig
    settings:
      base:
        # Same codesign requirement as every other test bundle here —
        # see `FireflyHardwareTests`' own comment.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Firefly:
    build:
      targets:
        Firefly: all
        FireflyHardwareTests: [test]
        FireflyAppTests: [test]
        FireflyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Two test plans, not the legacy per-scheme `targets:`/
      # `environmentVariables:` list:
      #
      # - Firefly.xctestplan (default): FireflyHardwareTests +
      #   FireflyAppTests. FireflyKit's own (non-hardware) tests run
      #   under `swift test`, which is faster and needs no simulator or
      #   app host; the app-hosted BLE hardware suite and slice C's
      #   app-target view-model suite run through this plan.
      #
      # - FireflyUITests.xctestplan (not default): FireflyUITests only.
      #
      # Review PR #275, BLOCKING 1: a hosted CI runner cannot grant the
      # Accessibility permission macOS UI-automation needs, and there is
      # no persisted TCC grant between ephemeral runner instances — a
      # UI-test runner bundle apparently needs that grant just to
      # bootstrap and report which of its tests are enabled/skipped, so
      # even a single skipped-but-still-a-member test crashes it on
      # launch (confirmed empirically fixing this: `skippedTests` on an
      # otherwise-present, enabled target still triggered the "crashed
      # with signal kill before establishing connection" failure on
      # macOS). Excluding FireflyUITests from the DEFAULT plan entirely
      # is what keeps a bare `xcodebuild test`/Cmd+U from ever attempting
      # it, on either platform.
      #
      # `-only-testing:<target>` needs the target to be an actual member
      # of whichever plan is in effect (confirmed empirically: it errors
      # "isn't a member of the specified test plan or scheme" against a
      # target that is absent, or disabled, in the plan `xcodebuild`
      # resolves to) — it does NOT reach across into a different plan
      # attached to the same scheme. So CI's iOS Simulator leg selects
      # the FireflyUITests plan explicitly:
      #
      #   xcodebuild test -scheme Firefly -testPlan FireflyUITests \
      #     -only-testing:FireflyUITests \
      #     -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
      #
      # which is exactly how a developer opts in locally on macOS too,
      # after granting Accessibility to Xcode — see app/README.md,
      # "Running the macOS UI smoke test locally".
      testPlans:
        - path: FireflyUITests.xctestplan
        - path: Firefly.xctestplan
          defaultPlan: true
    archive:
      config: Release
